<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행운 번호 추첨</title>
  <style>
    :root {
      --ink: #202938;
      --muted: #748096;
      --orange: #f59e0b;
      --orange-dark: #d97706;
      --line: #e8edf3;
      --card: rgba(255, 255, 255, .94);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      color: var(--ink); font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at 10% 0%, #fff4c4, transparent 34%),
                  linear-gradient(135deg, #fffaf0, #ffe8c7);
    }
    .app { max-width: 1080px; margin: auto; overflow: hidden; border-radius: 28px;
      background: var(--card); box-shadow: 0 24px 70px rgba(55, 42, 20, .16); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 24px 30px; color: white; background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -.06em; }
    header p { margin-bottom: 0; opacity: .9; }
    .count { padding: 10px 15px; border: 1px solid #ffffff55; border-radius: 999px;
      background: #ffffff2b; font-weight: 800; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .mode-toggle { padding: 10px 14px; border: 1px solid #ffffff66; border-radius: 999px;
      color: white; background: #ffffff22; font: inherit; font-size: .9rem; font-weight: 800;
      cursor: pointer; white-space: nowrap; transition: .18s; }
    .mode-toggle:hover { background: #ffffff3d; transform: translateY(-1px); }
    body.monochrome { filter: grayscale(1); }
    main { display: grid; grid-template-columns: 1.2fr .8fr; gap: 26px; padding: 28px; }
    section { padding: 24px; border: 1px solid var(--line); border-radius: 22px; background: white; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h2 { margin-bottom: 18px; font-size: 1.25rem; }
    .help { color: var(--muted); font-size: .9rem; }
    .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 9px; }
    .number { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 50%; color: var(--ink);
      background: #f8fafc; font-weight: 800; cursor: pointer; transition: .18s; }
    .number:hover { transform: translateY(-2px); box-shadow: 0 7px 14px #1f293714; }
    .number.selected { color: white; border-color: transparent; background: var(--orange);
      box-shadow: 0 8px 16px #f59e0b55; }
    .selected { margin-top: 20px; padding: 15px; border: 1px dashed #f59e0b88;
      border-radius: 15px; background: #fffaf0; }
    .selected small { display: block; margin-bottom: 8px; color: var(--muted); font-weight: 800; }
    #selectedList { min-height: 24px; color: var(--orange-dark); font-weight: 900; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button.action { padding: 13px 17px; border: 0; border-radius: 13px; font-size: .98rem;
      font-weight: 800; cursor: pointer; transition: .18s; }
    button.action:hover { transform: translateY(-1px); }
    .draw { color: white; background: linear-gradient(135deg, var(--orange), var(--orange-dark)); }
    .auto { color: white; background: #293241; }
    .reset { color: var(--ink); background: #eef1f5; }
    .result { min-height: 150px; display: flex; justify-content: center; align-items: center;
      flex-wrap: wrap; gap: 12px; padding: 14px; border: 1px solid var(--line);
      border-radius: 18px; background: #fffcf5; }
    .empty { color: var(--muted); font-weight: 700; text-align: center; }
    .ball, .mini-ball { display: inline-flex; align-items: center; justify-content: center;
      color: white; font-weight: 900; border-radius: 50%; background: #9ca3af; }
    .ball { width: 60px; height: 60px; font-size: 1.25rem; opacity: 0; transform: scale(.75);
      transition: .25s; box-shadow: inset 0 -7px 10px #0002, 0 8px 15px #1f29331c; }
    .ball.show { opacity: 1; transform: scale(1); }
    .history { display: grid; gap: 9px; }
    .history-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 12px; background: #f8fafc; color: var(--muted);
      font-size: .9rem; font-weight: 700; }
    .mini-list { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .mini-ball { width: 25px; height: 25px; font-size: .7rem; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    @media (max-width: 540px) {
      header { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(6, 1fr); }
      main { padding: 16px; } section { padding: 18px; }
      .ball { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>🎱 행운 번호 추첨</h1><p>나만의 번호를 고르고 오늘의 행운을 확인해 보세요.</p></div>
      <div class="header-actions">
        <button class="mode-toggle" id="modeToggle" type="button">◐ 흑백모드</button>
        <div class="count" id="count">오늘 0회 추첨</div>
      </div>
    </header>
    <main>
      <section>
        <div class="heading"><h2>번호 선택</h2><span class="help">최대 6개</span></div>
        <div class="grid" id="grid"></div>
        <div class="selected"><small>선택한 번호</small><div id="selectedList">아직 선택된 번호가 없어요.</div></div>
        <div class="actions">
          <button class="action draw" id="draw">🎯 번호 뽑기</button>
          <button class="action auto" id="auto">✨ 자동 추천</button>
          <button class="action reset" id="reset">🔄 초기화</button>
        </div>
      </section>
      <section>
        <h2>추첨 결과</h2>
        <div class="result" id="result"><div class="empty">번호를 뽑아주세요.</div></div>
        <h2 style="margin-top:24px">최근 추첨 기록</h2>
        <div class="history" id="history"></div>
      </section>
    </main>
  </div>
  <script>
    const chosen = new Set(), key = "holy-lotto-history";
    const modeKey = "holy-lotto-monochrome";
    const $ = (id) => document.getElementById(id);
    const color = (n) => n <= 10 ? "#facc15" : n <= 20 ? "#60a5fa" : n <= 30 ? "#f87171" : n <= 40 ? "#9ca3af" : "#34d399";
    for (let n = 1; n <= 45; n++) {
      const button = document.createElement("button");
      button.className = "number"; button.type = "button"; button.textContent = n;
      button.onclick = () => {
        if (chosen.has(n)) { chosen.delete(n); button.classList.remove("selected"); }
        else if (chosen.size < 6) { chosen.add(n); button.classList.add("selected"); }
        else { alert("번호는 최대 6개까지 선택할 수 있습니다."); return; }
        updateSelected();
      };
      $("grid").appendChild(button);
    }
    function updateSelected() {
      const values = [...chosen].sort((a, b) => a - b);
      $("selectedList").textContent = values.length ? values.join(" · ") : "아직 선택된 번호가 없어요.";
    }
    function randomNumbers() {
      const pool = Array.from({ length: 45 }, (_, i) => i + 1), result = [];
      while (result.length < 6) result.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      return result.sort((a, b) => a - b);
    }
    function preferredNumbers() {
      const values = [...chosen], pool = Array.from({ length: 45 }, (_, i) => i + 1).filter(n => !chosen.has(n));
      while (values.length < 6) values.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      return values.sort((a, b) => a - b);
    }
    function makeBall(n, mini = false) {
      const ball = document.createElement("span");
      ball.className = mini ? "mini-ball" : "ball"; ball.textContent = n; ball.style.background = color(n);
      return ball;
    }
    async function draw(prefer) {
      const values = prefer ? preferredNumbers() : randomNumbers();
      $("draw").disabled = true; $("draw").textContent = "추첨 중...";
      $("result").innerHTML = "";
      const balls = values.map(() => makeBall(0));
      balls.forEach(ball => { ball.textContent = "?"; ball.style.background = "#9ca3af"; $("result").appendChild(ball); });
      for (let i = 0; i < balls.length; i++) {
        await new Promise(resolve => setTimeout(resolve, 160));
        balls[i].textContent = values[i]; balls[i].style.background = color(values[i]); balls[i].classList.add("show");
      }
      const history = JSON.parse(localStorage.getItem(key) || "[]");
      history.unshift({ numbers: values, time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) });
      localStorage.setItem(key, JSON.stringify(history.slice(0, 6))); renderHistory();
      $("draw").disabled = false; $("draw").textContent = "🎯 번호 뽑기";
    }
    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(key) || "[]");
      $("count").textContent = `오늘 ${history.length}회 추첨`;
      $("history").innerHTML = history.length ? history.map(item =>
        `<div class="history-row"><span>${item.time}</span><div class="mini-list">${item.numbers.map(n => `<span class="mini-ball" style="background:${color(n)}">${n}</span>`).join("")}</div></div>`
      ).join("") : '<div class="empty">아직 추첨 기록이 없어요.</div>';
    }
    $("draw").onclick = () => draw(true);
    $("auto").onclick = () => draw(false);
    $("reset").onclick = () => {
      chosen.clear(); document.querySelectorAll(".number.selected").forEach(b => b.classList.remove("selected"));
      updateSelected(); $("result").innerHTML = '<div class="empty">번호를 뽑아주세요.</div>';
    };
    function updateModeButton() {
      const monochrome = document.body.classList.contains("monochrome");
      $("modeToggle").textContent = monochrome ? "◐ 컬러모드" : "◐ 흑백모드";
      $("modeToggle").setAttribute("aria-pressed", String(monochrome));
    }
    $("modeToggle").onclick = () => {
      document.body.classList.toggle("monochrome");
      localStorage.setItem(modeKey, document.body.classList.contains("monochrome") ? "on" : "off");
      updateModeButton();
    };
    if (localStorage.getItem(modeKey) === "on") document.body.classList.add("monochrome");
    updateModeButton();
    renderHistory();
  </script>
</body>
</html>
